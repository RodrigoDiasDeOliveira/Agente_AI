services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agente
      POSTGRES_PASSWORD: agente
      POSTGRES_DB: agente
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agente"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_ML: "false"
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  db_data:
