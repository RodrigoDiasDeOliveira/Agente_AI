version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python run.py
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/appdb}
      DOCS_PATH: ${DOCS_PATH:-./data/docs}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-changeme}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GCP_REGION: ${GCP_REGION:-southamerica-east1}
      LLM_PROVIDER: ${LLM_PROVIDER:-vertex}
      VS_ENDPOINT_ID: ${VS_ENDPOINT_ID:-}
      VS_DEPLOYED_ID: ${VS_DEPLOYED_ID:-}
      BQ_DATASET: ${BQ_DATASET:-}
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    image: node:20
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_AGENT_API_URL: ${VITE_AGENT_API_URL:-http://localhost:8000}
    volumes:
      - .:/app
    ports:
      - "5173:5173"

volumes:
  postgres_data:
