name: Terraform

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt
        run: terraform -chdir=infrastructure/terraform/envs/${{ matrix.env }} fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=infrastructure/terraform/envs/${{ matrix.env }} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infrastructure/terraform/envs/${{ matrix.env }} validate

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: TFLint
        run: tflint --chdir=infrastructure/terraform/envs/${{ matrix.env }}

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov
        run: checkov -d infrastructure/terraform --quiet --framework terraform

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform -chdir=infrastructure/terraform/envs/${{ matrix.env }} plan -no-color -input=false
